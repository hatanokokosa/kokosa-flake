<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Regional substitutions run after 52-nixos-default-fonts.conf. -->
  <match target="pattern">
    <test name="lang">
      <string>zh-HK</string>
    </test>
    <test name="family" qual="any">
      <string>Source Han Sans SC</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Sans HC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>zh-HK</string>
    </test>
    <test name="family" qual="any">
      <string>Source Han Serif SC</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Serif HC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>zh-TW</string>
    </test>
    <test name="family" qual="any">
      <string>Source Han Sans SC</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Sans TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>zh-TW</string>
    </test>
    <test name="family" qual="any">
      <string>Source Han Serif SC</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Serif TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>ja</string>
    </test>
    <test name="family" qual="any">
      <string>Source Han Sans SC</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>ja</string>
    </test>
    <test name="family" qual="any">
      <string>Source Han Serif SC</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>ko</string>
    </test>
    <test name="family" qual="any">
      <string>Source Han Sans SC</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Sans K</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>ko</string>
    </test>
    <test name="family" qual="any">
      <string>Source Han Serif SC</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Serif K</string>
    </edit>
  </match>

</fontconfig>
