<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias binding="strong">
    <family>-apple-system</family>
    <prefer>
      <family>sans-serif</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>BlinkMacSystemFont</family>
    <prefer>
      <family>sans-serif</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>Microsoft Sans Serif</family>
    <prefer>
      <family>sans-serif</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>Microsoft YaHei</family>
    <prefer>
      <family>sans-serif</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>Apple Color Emoji</family>
    <prefer>
      <family>emoji</family>
    </prefer>
  </alias>

  <match target="pattern">
    <test name="lang">
      <string>zh-HK</string>
    </test>
    <test name="family" qual="any">
      <string>Source Han Sans SC VF</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Sans HC VF</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>zh-HK</string>
    </test>
    <test name="family" qual="any">
      <string>Source Han Serif SC VF</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Serif HC VF</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>zh-HK</string>
    </test>
    <test name="family" qual="any">
      <string>Noto Sans Mono CJK SC</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans Mono CJK HK</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>zh-TW</string>
    </test>
    <test name="family" qual="any">
      <string>Source Han Sans SC VF</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Sans TC VF</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>zh-TW</string>
    </test>
    <test name="family" qual="any">
      <string>Source Han Serif SC VF</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Serif TC VF</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>zh-TW</string>
    </test>
    <test name="family" qual="any">
      <string>Noto Sans Mono CJK SC</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans Mono CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>ja</string>
    </test>
    <test name="family" qual="any">
      <string>Source Han Sans SC VF</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Sans VF</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>ja</string>
    </test>
    <test name="family" qual="any">
      <string>Source Han Serif SC VF</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Serif VF</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>ja</string>
    </test>
    <test name="family" qual="any">
      <string>Noto Sans Mono CJK SC</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans Mono CJK JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>ko</string>
    </test>
    <test name="family">
      <string>Source Han Sans SC VF</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Sans K VF</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>ko</string>
    </test>
    <test name="family" qual="any">
      <string>Source Han Serif SC VF</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Serif K VF</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>ko</string>
    </test>
    <test name="family" qual="any">
      <string>Noto Sans Mono CJK SC</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans Mono CJK KR</string>
    </edit>
  </match>
</fontconfig>
