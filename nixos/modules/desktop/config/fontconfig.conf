<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias binding="strong">
    <family>-apple-system</family>
    <prefer>
      <family>sans-serif</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>BlinkMacSystemFont</family>
    <prefer>
      <family>sans-serif</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>system-ui</family>
    <prefer>
      <family>sans-serif</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>Microsoft Sans Serif</family>
    <prefer>
      <family>sans-serif</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>Microsoft YaHei</family>
    <prefer>
      <family>sans-serif</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>Apple Color Emoji</family>
    <prefer>
      <family>emoji</family>
    </prefer>
  </alias>

  <match target="pattern">
    <test name="lang">
      <string>zh-HK</string>
    </test>
    <test name="family" qual="any">
      <string>Source Han Sans SC</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Sans HC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>zh-HK</string>
    </test>
    <test name="family" qual="any">
      <string>Source Han Serif SC</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Serif HC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>zh-TW</string>
    </test>
    <test name="family" qual="any">
      <string>Source Han Sans SC</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Sans TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>zh-TW</string>
    </test>
    <test name="family" qual="any">
      <string>Source Han Serif SC</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Serif TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>ja</string>
    </test>
    <test name="family" qual="any">
      <string>Source Han Sans SC</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>ja</string>
    </test>
    <test name="family" qual="any">
      <string>Source Han Serif SC</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>ko</string>
    </test>
    <test name="family">
      <string>Source Han Sans SC</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Sans K</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>ko</string>
    </test>
    <test name="family" qual="any">
      <string>Source Han Serif SC</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Source Han Serif K</string>
    </edit>
  </match>

</fontconfig>
